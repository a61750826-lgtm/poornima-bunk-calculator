name: Build Poornima Bunk Calculator Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android NDK & SDK
      uses: android-actions/setup-android@v3

    - name: Build C++ Native Core
      run: |
        mkdir -p build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)
      working-directory: core

    - name: Package Android APK with Gradle
      run: |
        chmod +x gradlew || true
        ./gradlew assembleRelease || ./gradlew assembleDebug

    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Poornima-Bunk-Calculator-APK
        path: app/build/outputs/apk/**/*.apk
