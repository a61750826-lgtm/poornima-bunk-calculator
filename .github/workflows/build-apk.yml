name: Build Poornima Bunk Calculator APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Build C++ Native Core
        run: |
          cd core/src
          g++ -O3 -std=c++17 main.cpp -o ../bunk_core
          ../bunk_core ../bunk_report.json

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poornima-Bunk-Calculator-Release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poornima-Bunk-Calculator-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
